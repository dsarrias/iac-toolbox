name: iac-toolbox CI/CD

on:
  pull_request:
    branches: [ "main" ]
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: iac-toolbox
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/iac-toolbox
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/iac-toolbox
  DOCKLE_VERSION: 0.4.15

jobs:
  # Tag pushes release that tag; schedule/dispatch rebuild the latest release with fresh base packages
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Resolve source ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            pull_request) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            push) printf 'release=true\nref=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) printf 'release=true\nref=%s\n' "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT" ;;
          esac

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Run Hadolint (Wolfi)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.wolfi
          failure-threshold: error
          ignore: DL3007,DL3018

  build-scan:
    name: build-scan (${{ matrix.flavor }}, ${{ matrix.arch }})
    needs: [resolve, lint]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [alpine, wolfi, k8s]
        arch: [amd64, arm64]
        include:
          - flavor: alpine
            dockerfile: Dockerfile
          - flavor: wolfi
            dockerfile: Dockerfile.wolfi
          - flavor: k8s
            dockerfile: Dockerfile
            target: k8s
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        id: build
        if: needs.resolve.outputs.release != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Log in to GitHub Container Registry
        if: needs.resolve.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.resolve.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed untagged; only promoted to real tags after the scans below pass
      - name: Build and push by digest
        id: push
        if: needs.resolve.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.GHCR_REPO }},${{ env.DOCKERHUB_REPO }}",push-by-digest=true,name-canonical=true,push=true

      - name: Pull pushed image for scanning
        id: pull
        if: needs.resolve.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$GHCR_REPO@$DIGEST"
          docker tag "$GHCR_REPO@$DIGEST" "$IMAGE_NAME:scan"

      - name: Run Dockle (Best Practices)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dockleignore:/.dockleignore" \
            "goodwithtech/dockle:v$DOCKLE_VERSION" --exit-code 1 --exit-level warn "$IMAGE_NAME:scan"

      - name: Run Trivy (Vulnerability Scanner)
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.pull.outcome == 'success') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          hide-progress: true
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-files: /usr/local/bin/terraform,/usr/local/bin/terragrunt,/usr/local/bin/tofu,/usr/local/bin/tflint,/usr/local/bin/terraform-docs,/usr/local/bin/trivy,/usr/local/bin/kubectl,/usr/local/bin/helm,/usr/local/bin/k9s

      - name: Export digest
        if: needs.resolve.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.resolve.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Single required status check for branch protection, independent of matrix job names
  ci-ok:
    needs: [lint, build-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Runs per flavor even if another flavor failed; a flavor is promoted only if both arches passed
  promote:
    name: promote (${{ matrix.flavor }})
    needs: [resolve, build-scan]
    if: ${{ !cancelled() && needs.resolve.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [alpine, wolfi, k8s]
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.flavor }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Check both architectures passed
        run: test "$(ls /tmp/digests | wc -l)" -eq 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REPO }}
            ${{ env.DOCKERHUB_REPO }}
          flavor: |
            latest=true
            prefix=${{ matrix.flavor != 'alpine' && format('{0}-', matrix.flavor) || '' }},onlatest=true
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.resolve.outputs.ref }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.resolve.outputs.ref }}
            type=semver,pattern=v{{major}},value=${{ needs.resolve.outputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest lists, tag and sign
        working-directory: /tmp/digests
        run: |
          for repo in "$GHCR_REPO" "$DOCKERHUB_REPO"; do
            tags=$(jq -r --arg r "$repo:" '.tags[] | select(startswith($r))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            docker buildx imagetools create $(printf -- '-t %s ' $tags) $(printf "$repo@sha256:%s " *)
            digest=$(docker buildx imagetools inspect "$(head -n1 <<< "$tags")" --format '{{json .Manifest}}' | jq -r .digest)
            cosign sign --yes "$repo@$digest"
          done

  sync-readme-to-dockerhub:
    needs: promote
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.promote.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync README to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
        run: |
          token=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/ | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")

          if [ -z "$token" ]; then
            echo "::error::Docker Hub login failed"
            exit 1
          fi

          readme_json=$(python3 - <<'PY'
          import json
          try:
            with open('README.md', encoding='utf-8') as f:
              print(json.dumps(f.read()))
          except Exception as e:
            print("")
          PY
          )

          http_code=$(curl -s -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO}/" \
            -H "Authorization: JWT ${token}" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": $readme_json}" \
            -o /tmp/dockerhub_response.json -w "%{http_code}")

          if [ "$http_code" != "200" ]; then
            echo "::error::Failed to sync README (HTTP $http_code)"
            exit 1
          fi
          echo "README successfully synced"
